# API

apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: sistema-pedidos
spec:
  selector:
    app: api
  ports:
    - port: 8080
      targetPort: 8080
  type: NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: sistema-pedidos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: node:20-alpine
          command: ["node", "src/index.js"]
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          env:
            - name: PORT
              value: "8080"
            - name: SERVICO_PEDIDOS_URL
              value: "http://servico-pedidos:8080"
            - name: SERVICO_PAGAMENTOS_URL
              value: "http://servico-pagamentos:8080"
            - name: SERVICO_ESTOQUE_URL
              value: "http://servico-estoque:8080"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-hpa
  namespace: sistema-pedidos
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---