# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: sistema-pedidos
---
# ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: db_app_pedidos
  DB_USER: db_user_pedidos
  NODE_ENV: production
  PORT: "8080"
---
# Secret
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: sistema-pedidos
type: Opaque
data:
  # Valor em Base64
  DB_PASSWORD: eTc3P3k3eSs1Nkc1
---

# Banco de dados

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: sistema-pedidos
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: sistema-pedidos
spec:
  selector:
    app: postgres
  ports:
    - name: db
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: sistema-pedidos
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
              name: db
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_NAME
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: DB_PASSWORD
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: db-secret-volume
              mountPath: /run/secrets
              readOnly: true
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - "pg_isready -U db_user_pedidos -d db_app_pedidos"
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - "pg_isready -U db_user_pedidos -d db_app_pedidos"
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: db-secret-volume
          secret:
            secretName: app-secret
            items:
              - key: DB_PASSWORD
                path: DB_PASSWORD
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: postgres-vpa
  namespace: sistema-pedidos
spec:
  targetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: postgres
  updatePolicy:
    updateMode: "Auto"
---

########## servico-pedidos

apiVersion: v1
kind: Service
metadata:
  name: servico-pedidos
  namespace: sistema-pedidos
spec:
  selector:
    app: servico-pedidos
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: servico-pedidos
  namespace: sistema-pedidos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: servico-pedidos
  template:
    metadata:
      labels:
        app: servico-pedidos
    spec:
      containers:
        - name: servico-pedidos
          image: node:20-alpine
          command: ["node", "src/servico_pedidos.js"]
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: PORT
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_USER
            - name: DB_PASSWORD_FILE
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: DB_PASSWORD
          volumeMounts:
            - name: db-secret-volume
              mountPath: /run/secrets
              readOnly: true
      volumes:
        - name: db-secret-volume
          secret:
            secretName: app-secret
            items:
              - key: DB_PASSWORD
                path: DB_PASSWORD
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: servico-pedidos-hpa
  namespace: sistema-pedidos
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: servico-pedidos
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---

